<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Online Voting System</title>
    <style>
      body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 40px; background: #eef2f3; }
      .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
      h2 { margin-top: 0; color: #333; }
      input, button { width: 100%; padding: 12px; margin-top: 12px; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
      button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
      button:hover { background: #0056b3; }
      button:disabled { background: #ccc; cursor: not-allowed; }
      .success { color: #28a745; font-weight: bold; }
      .error { color: #dc3545; font-weight: bold; }
      .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white; }
      .badge-green { background: #28a745; }
      .badge-red { background: #dc3545; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
